<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7d9c">
  <meta name="description" content="心跳交点：周子清的奇妙日常">
  <title>心跳交点</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="menuBtn" class="round-btn" aria-label="角色地图">☰</button>
      <div class="brand"><span>HEARTBEAT INTERSECTION</span><h1>心跳交点</h1></div>
      <button id="phoneBtn" class="phone-btn">消息 <b id="unreadBadge">0</b></button>
    </header>

    <section class="game">
      <aside id="cityPanel" class="city-panel">
        <div class="profile"><div class="avatar">清</div><div><strong>周子清</strong><small>腹黑 · 游刃有余</small></div></div>
        <p class="panel-label">CITY MAP</p><nav id="characterList" class="character-list"></nav>
        <div class="panel-actions"><button id="saveBtn">保存</button><button id="loadBtn">读取</button><button id="audioBtn">静音</button></div>
      </aside>

      <section id="stage" class="stage">
        <div id="placeTag" class="place-tag">深夜便利店</div>
        <button id="installBtn" class="install-btn" hidden>安装游戏</button>
        <div id="cgOverlay" class="cg-overlay" hidden><div id="cgCard" class="cg-card"><span id="cgLabel">SPECIAL CG</span><strong id="cgTitle"></strong></div></div>
        <div class="character-art">
          <img id="protagonistArt" class="protagonist-art" alt="周子清" src="assets/characters/zhouziqing/base.webp">
          <img id="heroineArt" class="heroine-art" alt="角色立绘" src="assets/characters/liuyi/base.webp">
        </div>
        <section class="dialogue-box">
          <div class="dialogue-meta"><strong id="speaker">刘一</strong><span id="mood">高冷装甲</span></div>
          <p id="dialogueText"></p><div id="choices" class="choices"></div>
          <button id="nextBtn" class="next-btn">▼</button>
        </section>
      </section>
    </section>

    <aside id="phonePanel" class="phone-panel" aria-hidden="true">
      <header><div><small>MESSENGER</small><strong>手机消息</strong></div><button id="closePhone">×</button></header>
      <div id="chatList" class="chat-list"></div>
    </aside>
  </main>
  <script src="game.js"></script>
</body>
</html>
