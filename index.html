<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7d9c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="《心跳交点：周子清的奇妙日常》Galgame PWA 原型">
  <title>心跳交点 · 周子清的奇妙日常</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="menuBtn" class="menu-btn" aria-label="打开角色地图">☰</button>
      <div class="title-block">
        <span>HEARTBEAT INTERSECTION</span>
        <h1>心跳交点</h1>
      </div>
      <button id="phoneBtn" class="phone-btn" aria-label="打开手机">
        <span>消息</span><b id="unreadBadge">0</b>
      </button>
    </header>

    <section class="game">
      <aside id="cityPanel" class="city-panel">
        <div class="profile">
          <div class="protagonist-avatar">清</div>
          <div><strong>周子清</strong><small>腹黑 · 游刃有余</small></div>
        </div>
        <p class="panel-label">城市地图 / CHARACTERS</p>
        <nav id="characterList" class="character-list"></nav>
        <div class="panel-actions">
          <button id="saveBtn">保存进度</button>
          <button id="loadBtn">读取进度</button>
        </div>
      </aside>

      <section id="stage" class="stage">
        <div id="placeTag" class="place-tag">深夜便利店</div>
        <button id="installBtn" class="install-btn" hidden>安装游戏</button>
        <div class="atmosphere"></div>

        <div class="character-art">
          <div class="protagonist-silhouette">
            <div class="hair"></div><div class="face"><i></i><i></i></div>
            <div class="coat"><span>周子清</span></div>
          </div>
          <div id="heroineArt" class="heroine-art"></div>
        </div>

        <section class="dialogue-box" aria-live="polite">
          <div class="dialogue-meta">
            <strong id="speaker">刘一</strong>
            <span id="mood">高冷装甲</span>
          </div>
          <p id="dialogueText"></p>
          <div id="choices" class="choices"></div>
          <button id="nextBtn" class="next-btn" aria-label="下一句">▼</button>
        </section>
      </section>
    </section>

    <aside id="phonePanel" class="phone-panel" aria-hidden="true">
      <header><div><small>MESSENGER</small><strong>手机消息</strong></div><button id="closePhone" aria-label="关闭">×</button></header>
      <div id="chatList" class="chat-list"></div>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
